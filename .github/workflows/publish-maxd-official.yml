# YouTube Max’d - Publish the verified 1.4.0 official release without replacing assets.
# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish Max'd 1.4.0 official release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-maxd-v1.4.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable-release publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-tools
          persist-credentials: false

      - name: Check out corresponding application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 86704eaa2dfe271b021f3ed66e756a9733c1917a
          path: app-source
          persist-credentials: false

      - name: Restore pinned public dependencies
        working-directory: app-source
        env:
          PROSPEROTUBE_UI_KIT: https://github.com/LedyBacer/ps5-homebrew-ui.git
        run: |
          set -euo pipefail
          git -c url.https://github.com/LedyBacer/.insteadOf=https://github.com/blackbearreloaded/ submodule update --init --recursive
          python3 scripts/ui_kit.py

      - name: Check out the verified PS5 bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6db7819411770bf32c7f022026c6da5a16e08236
          path: downloads
          persist-credentials: false

      - name: Package complete corresponding sources
        working-directory: app-source
        run: |
          set -euo pipefail
          mkdir -p dist
          cp ../downloads/YouTube-Maxd-PS5.zip dist/PPSA99991.zip
          python3 scripts/package_maxd_release.py

      - name: Verify and assemble release attachments
        run: |
          set -euo pipefail
          python3 release-tools/scripts/assemble_maxd_official.py --dist app-source/dist --out release --archive-commit 86704eaa2dfe271b021f3ed66e756a9733c1917a
          cd release
          sha256sum --check --strict SHA256SUMS

      - name: Upload immutable files and publish the official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v1.4.0'
          release_id = 417812688
          def release():
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/{release_id}']))
          current = release()
          if current.get('tag_name') != tag or current.get('prerelease') or not current.get('draft'):
              raise SystemExit('Expected the unpublished official release')
          existing = {asset['name']: asset for asset in current.get('assets', [])}
          expected = {}
          for path in sorted(Path('release').iterdir()):
              with path.open('rb') as source:
                  expected[path.name] = 'sha256:' + hashlib.file_digest(source, 'sha256').hexdigest()
              if path.name in existing:
                  if existing[path.name].get('digest') != expected[path.name]:
                      raise SystemExit(f'Refusing to replace release asset: {path.name}')
                  continue
              subprocess.run(['gh', 'release', 'upload', tag, str(path), '--repo', repo], check=True)
          uploaded = {asset['name']: asset for asset in release().get('assets', [])}
          if set(uploaded) != set(expected):
              raise SystemExit('Release attachment list differs from the verified set')
          for name, digest in expected.items():
              if uploaded[name].get('digest') != digest or uploaded[name].get('state') != 'uploaded':
                  raise SystemExit(f'Uploaded digest/state mismatch: {name}')
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--latest=true', '--repo', repo], check=True)
          print(f'Published {tag}: {len(expected)} verified immutable attachments')
          PY
