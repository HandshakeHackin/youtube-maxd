# ProsperoTube - Check, build and release the app.
#
# Pull requests, version tags and manual runs build the app and run checks.
# Normal builds use the checked, pinned EVO shaders. The optional shader-tool
# snapshot is built only when explicitly requested by a manual snapshot run.
# A tag also publishes: job "release" attaches the ZIP job "build" made, with
# its checksum, to a GitHub pre-release. A release that already has a ZIP is
# never changed.
# Copyright (C) 2026 BlackBearReloaded
# SPDX-License-Identifier: GPL-3.0-or-later

name: Build

on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags:
      - "v[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also hand over this run's caches as the build-cache snapshots (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shader-compiler:
    name: PS5 shader compiler
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot
    runs-on: ubuntu-24.04
    # Compiling it (LLVM, LLPC, PAL) takes hours on a hosted runner; it happens
    # only when its pins change and no cache or snapshot holds it.
    timeout-minutes: 330
    outputs:
      key: ${{ steps.key.outputs.key }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Restore pinned dependencies
        run: bash scripts/restore_submodules.sh

      # The compiler is made from the pins in its recipe and a patch from EVO.
      - name: Name the compiler
        id: key
        run: |
          evo=$(git rev-parse HEAD:third_party/evo)
          recipe=$(sha256sum scripts/build_ps5_shader_compiler.sh | cut -c 1-16)
          echo "key=shader-compiler-$RUNNER_OS-$RUNNER_ARCH-$evo-$recipe" >> "$GITHUB_OUTPUT"

      # Only the compiler and its library are kept (about 130 MB), not its sources
      # and build tree (several GB).
      - name: Restore the PS5 shader compiler
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/prosperotube/shader-tools/bin
            ~/.cache/prosperotube/shader-tools/lib
            ~/.cache/prosperotube/shader-tools/.prosperotube-recipe
          key: ${{ steps.key.outputs.key }}

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's.
      # When nothing was restored, take the snapshot kept as a file of the build-cache
      # release, if it is this same compiler.
      - name: Fetch the compiler snapshot
        id: snapshot
        if: steps.restore.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          tools=~/.cache/prosperotube/shader-tools
          if gh release download build-cache --repo "$GITHUB_REPOSITORY" --pattern shader-compiler.tar.zst --dir "$RUNNER_TEMP" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/shader-snapshot"
            tar -I zstd -xf "$RUNNER_TEMP/shader-compiler.tar.zst" -C "$RUNNER_TEMP/shader-snapshot"
            if [ "$(cat "$RUNNER_TEMP/shader-snapshot/.ci-key")" = "$KEY" ]; then
              mkdir -p "$tools"
              cp -a "$RUNNER_TEMP/shader-snapshot/bin" "$RUNNER_TEMP/shader-snapshot/lib" \
                "$RUNNER_TEMP/shader-snapshot/.prosperotube-recipe" "$tools/"
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=Shader compiler::Taken from the build-cache snapshot."
            else
              echo "The snapshot holds another compiler; building this one."
            fi
          fi

      - name: Make room for the compiler build
        if: steps.restore.outputs.cache-hit != 'true' && steps.snapshot.outputs.found != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install the toolchain
        if: steps.restore.outputs.cache-hit != 'true' && steps.snapshot.outputs.found != 'true'
        run: make host-deps

      - name: Build the PS5 shader compiler
        if: steps.restore.outputs.cache-hit != 'true' && steps.snapshot.outputs.found != 'true'
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          PROSPEROTUBE_SHADER_JOBS=$(nproc) bash scripts/build_ps5_shader_compiler.sh

      # Saved now, not at the end of the run: the next run starts from here even
      # when a later job fails.
      - name: Save the PS5 shader compiler
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/prosperotube/shader-tools/bin
            ~/.cache/prosperotube/shader-tools/lib
            ~/.cache/prosperotube/shader-tools/.prosperotube-recipe
          key: ${{ steps.key.outputs.key }}

      - name: Pack the compiler snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          tools=~/.cache/prosperotube/shader-tools
          printf '%s\n' "$KEY" > "$tools/.ci-key"
          tar -I 'zstd -19 -T0' -cf "$RUNNER_TEMP/shader-compiler.tar.zst" -C "$tools" bin lib .prosperotube-recipe .ci-key

      - name: Upload the compiler snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shader-compiler-snapshot
          path: ${{ runner.temp }}/shader-compiler.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    name: Build the release ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The two write entries are for the attestation step only: a signing identity for this run,
    # and storing the attestation. A pull request from a fork gets neither, whatever is asked.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 1G
    outputs:
      artifact: ${{ steps.label.outputs.artifact }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Restore pinned dependencies
        run: bash scripts/restore_submodules.sh

      # clang-tidy is a local check; it is not installed or run here.
      - name: Install the toolchain
        run: make host-deps

      - name: Read app identity and version
        shell: bash
        run: |
          read -r title_id content_version version <<< "$(python3 scripts/release_version.py)"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$content_version" ]]; then
            echo "The release tag must be v + the content version in scripts/prepare_native.py: v$content_version" >&2
            exit 2
          fi
          # A tag needs its notes before the build, not after.
          python3 scripts/release_version.py --notes > /dev/null
          {
            echo "TITLE_ID=$title_id"
            echo "CONTENT_VERSION=$content_version"
            echo "APP_VERSION=$version"
            echo "EVO_PIN=$(git rev-parse HEAD:third_party/evo)"
          } >> "$GITHUB_ENV"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder (build-label.txt); the version stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=${GITHUB_REPOSITORY##*/}-$CONTENT_VERSION-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi


      # The SDK prefix also receives the PS5 builds of dav1d and FFmpeg
      # (scripts/build_ps5.sh), so the key names everything they are built from.
      - name: Restore the PS5 SDK, dav1d and FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/prosperotube/sdk
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EVO_PIN }}-${{ hashFiles('scripts/bootstrap_sdk.sh', 'scripts/build_ps5.sh', 'scripts/patch_ffmpeg_dash_seek.py', 'scripts/patch_ffmpeg_hls_dvr.py', 'scripts/ffmpeg_hls_dvr.inc') }}

      - name: Restore Node and the npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/prosperotube/node
            ~/.npm
          key: node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap_build_deps.sh', 'companion/innertube/package-lock.json') }}

      # The Lapy helper's sources and SDK, the UI kit, QuickJS and the root certificates,
      # each fetched at a pinned revision or checksum.
      - name: Restore the pinned downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/lapy
            .deps/ui-kit
            standalone/ps5/.cache
          key: downloads-${{ runner.os }}-${{ hashFiles('scripts/build_lapy_helper.py', 'scripts/ui_kit.py', 'scripts/ui_kit.lock.json', 'standalone/ps5/fetch_quickjs.sh', 'standalone/ps5/fetch_cacert.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-ps5-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-ps5-

      # GitHub drops a cache nobody used for a week, and a pull request only sees main's. When
      # nothing was restored, start from the snapshot kept as a file of the build-cache release;
      # a manual run with "snapshot" ticked hands over a new one.
      - name: Fetch the compiler cache snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            if gh release download build-cache --repo "$GITHUB_REPOSITORY" --pattern ccache-ps5.tar --dir "$RUNNER_TEMP" 2>/dev/null; then
              mkdir -p "$CCACHE_DIR"
              tar -xf "$RUNNER_TEMP/ccache-ps5.tar" -C "$CCACHE_DIR"
              rm "$RUNNER_TEMP/ccache-ps5.tar"
              echo "::notice title=Compiler cache::Started from the build-cache snapshot."
            fi
          fi

      # EVO's build scripts send every PS5 compile through ccache when it is installed
      # (EVO_NO_CCACHE=1 would turn that off).
      - name: Send the compilers through the cache
        run: |
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Build the app
        run: make zip

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: tar -cf "$RUNNER_TEMP/ccache-ps5.tar" -C "$CCACHE_DIR" .

      - name: Upload the compiler cache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccache-snapshot
          path: ${{ runner.temp }}/ccache-ps5.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # The console only starts an app whose files are open to all, and some tools
      # keep a ZIP's permissions when unpacking: every entry is stored as 0777.
      - name: Label and check the release ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BUILD_LABEL:-}" ]]; then
            python3 scripts/zip_open_modes.py "dist/$TITLE_ID.zip" --label "$BUILD_LABEL"
          else
            python3 scripts/zip_open_modes.py "dist/$TITLE_ID.zip"
          fi
          python3 - "dist/$TITLE_ID.zip" "$TITLE_ID" "$CONTENT_VERSION" <<'PY'
          import json, sys, zipfile
          path, title, version = sys.argv[1:4]
          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist()
              wrong = [i.filename for i in entries if (i.external_attr >> 16) & 0o777 != 0o777]
              if not entries or wrong or archive.testzip() is not None:
                  raise SystemExit(f"ZIP check failed: {len(entries)} entries, not 0777: {wrong[:5]}")
              names = {i.filename for i in entries}
              outside = [n for n in names if not n.startswith(title + "/")]
              if outside:
                  raise SystemExit(f"ZIP check failed: entries outside {title}/: {outside[:5]}")
              for needed in ("eboot.bin", "sce_sys/param.json", "sce_sys/icon0.png", "sce_sys/pic0.dds",
                             "sce_sys/pic1.dds", "sce_sys/snd0.at9", "sce_module/libc.prx", "lapy.elf",
                             "lapy-manifest.json", "self-updater.elf"):
                  if f"{title}/{needed}" not in names:
                      raise SystemExit(f"ZIP check failed: {title}/{needed} is missing")
              param = json.loads(archive.read(f"{title}/sce_sys/param.json"))
              if param["titleId"] != title or param["contentVersion"] != version:
                  raise SystemExit("ZIP check failed: param.json is not this title at this version")
              print(f"{len(entries)} entries, all stored as 0777; {title} {version}")
          PY
          make verify
          cat dist/SHA256SUMS

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TITLE_ID }}.zip

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  checks:
    name: Offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Restore pinned dependencies
        run: bash scripts/restore_submodules.sh

      # clang-tidy is a local check; it is not installed or run here.
      - name: Install the toolchain
        run: make host-deps


      # Read only: job "build" alone saves the SDK, after adding dav1d and FFmpeg to it.
      # Without that cache (a first run) the checks fetch the SDK themselves.
      - name: Read the EVO pin
        run: echo "EVO_PIN=$(git rev-parse HEAD:third_party/evo)" >> "$GITHUB_ENV"

      - name: Restore the PS5 SDK
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/prosperotube/sdk
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EVO_PIN }}-${{ hashFiles('scripts/bootstrap_sdk.sh', 'scripts/build_ps5.sh', 'scripts/patch_ffmpeg_dash_seek.py', 'scripts/patch_ffmpeg_hls_dvr.py', 'scripts/ffmpeg_hls_dvr.inc') }}

      - name: Restore Node, npm and pip downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/prosperotube/node
            ~/.npm
            ~/.cache/pip
          key: checks-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap_build_deps.sh', 'companion/innertube/package-lock.json', 'companion/requirements.lock') }}

      # The text engine's libraries and RmlUi for the host checks, built from pinned releases.
      - name: Restore the host check libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/prosperotube/text-deps
            ~/.cache/prosperotube/rmlui
            .deps/ui-kit
            standalone/ps5/.cache
          key: checks-libraries-${{ runner.os }}-${{ hashFiles('scripts/text_deps.sh', 'scripts/rmlui_host.sh', 'scripts/ui_kit.py', 'scripts/ui_kit.lock.json', 'standalone/ps5/fetch_quickjs.sh', 'standalone/ps5/fetch_cacert.sh') }}

      - name: Restore the FFmpeg check sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/prosperotube/check-ffmpeg
          key: check-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_check_ffmpeg.sh', 'scripts/patch_ffmpeg_hls_dvr.py', 'scripts/ffmpeg_hls_dvr.inc') }}

      - name: Fetch the build dependencies
        run: make test-deps

      # The complete release pass (docs/BUILD.md, Checks): the generated native tree
      # that the overlay checks read, and the pinned FFmpeg trees of the DASH and DVR checks.
      - name: Prepare the native tree and the FFmpeg check sources
        run: |
          echo "PROSPEROTUBE_NATIVE_WORK=$HOME/.cache/prosperotube/native" >> "$GITHUB_ENV"
          PROSPEROTUBE_NATIVE_WORK=$HOME/.cache/prosperotube/native python3 scripts/prepare_native.py
          bash scripts/build_check_ffmpeg.sh >> "$GITHUB_ENV"

      - name: Run the offline checks
        run: make test

      - name: Upload the check logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-logs
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: GitHub pre-release
    if: github.ref_type == 'tag'
    needs: [build, checks]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CHANGELOG.md
            docs/releases
            scripts/release_version.py
            scripts/prepare_native.py
          sparse-checkout-cone-mode: false

      - name: Download the verified build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "$ARTIFACT"
          --dir release

      - name: Verify the release files
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test "$(find . -type f | wc -l)" -eq 2
          test -f PPSA99991.zip
          sha256sum --check --strict SHA256SUMS

      - name: Prepare the release notes
        shell: bash
        run: |
          python3 scripts/release_version.py --notes > release-notes.md
          test -s release-notes.md
          read -r _ _ version <<< "$(python3 scripts/release_version.py)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # Publishing a pre-release does not offer it in the app. Update discovery
      # requires a separately published entry in the signed homebrew.page catalog.
      - name: Publish the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/PPSA99991.zip release/SHA256SUMS)
          TAG=$GITHUB_REF_NAME
          # CI is the source of truth for release files: create the release, or fill one that
          # has no ZIP yet, and never replace a ZIP that is already published.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "ProsperoTube $APP_VERSION" --notes-file release-notes.md
            exit 0
          fi
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            if [[ $name == *.zip ]]; then
              echo "::warning title=Release files not from this run::A release for $TAG already has a ZIP; it was not replaced."
              exit 0
            fi
          done <<< "$existing"
          # Notes written in advance, or a draft: add the two files, leave title and notes alone.
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
