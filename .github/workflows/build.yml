name: Build

on:
  # A build on a branch is started by hand (Run workflow): pushes build nothing.
  # A version tag builds and publishes a pre-release. Pull request builds stay
  # off until the first manual run has filled the toolchain caches: that run
  # compiles the shader compiler, dav1d and FFmpeg and takes hours.
  push:
    tags:
      - "v[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build the release ZIP
    runs-on: ubuntu-24.04
    # The first run with new pins compiles the PS5 shader compiler (LLVM), FFmpeg
    # and dav1d; later runs take them from the caches below.
    timeout-minutes: 330
    # The two write entries are for the attestation step only: a signing identity for this run,
    # and storing the attestation. A pull request from a fork gets neither, whatever is asked.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CCACHE_DIR: ${{ github.workspace }}/.deps/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.10.0"

      # clang-tidy is a local check; it is not installed or run here.
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-18 lld-18 llvm-18 cmake ninja-build make git \
            python3 python3-venv pkg-config ccache wget curl ca-certificates unzip zip nasm yasm g++ \
            libssl-dev libcurl4-openssl-dev zlib1g-dev libfreetype-dev libzstd-dev libbz2-dev liblzma-dev \
            ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libswscale-dev \
            glslang-tools spirv-tools openssl
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Read app identity and version
        shell: bash
        run: |
          read -r title_id content_version version <<< "$(python3 scripts/release_version.py)"
          [[ $title_id =~ ^PPSA[0-9]{5}$ ]] || exit 2
          [[ $content_version =~ ^[0-9]{2}\.[0-9]{3}\.[0-9]{3}$ ]] || exit 2
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$content_version" ]]; then
            echo "The release tag must be v + the content version in scripts/prepare_native.py: v$content_version" >&2
            exit 2
          fi
          # A tag needs its notes before an hour of building, not after.
          python3 scripts/release_version.py --notes > /dev/null
          {
            echo "TITLE_ID=$title_id"
            echo "CONTENT_VERSION=$content_version"
            echo "APP_VERSION=$version"
            echo "EVO_PIN=$(git rev-parse HEAD:third_party/evo)"
          } >> "$GITHUB_ENV"

      # A pull request's build is named by its number and its own commit, on the
      # artifact and inside the app folder; the version stays the release's.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=prosperotube-release-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # The SDK prefix also receives the PS5 builds of dav1d and FFmpeg
      # (scripts/build_ps5.sh), so the key names everything they are built from.
      - name: Restore the PS5 SDK, dav1d and FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/prosperotube/sdk
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.EVO_PIN }}-${{ hashFiles('scripts/bootstrap_sdk.sh', 'scripts/build_ps5.sh', 'scripts/patch_ffmpeg_dash_seek.py') }}

      - name: Install the PS5 SDK
        run: bash scripts/bootstrap_sdk.sh

      # Only the compiler and its library are kept (about 130 MB); its sources and
      # build tree (several GB) are removed once it has passed its own check.
      - name: Restore the PS5 shader compiler
        id: shader
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/prosperotube/shader-tools/bin
            ~/.cache/prosperotube/shader-tools/lib
          key: shader-compiler-${{ runner.os }}-${{ runner.arch }}-${{ env.EVO_PIN }}-${{ hashFiles('scripts/build_ps5_shader_compiler.sh') }}

      - name: Build the PS5 shader compiler
        if: steps.shader.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install --yes --no-install-recommends build-essential python3-yaml python3-jinja2 python3-ruamel.yaml \
            g++-multilib gcc-multilib libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev \
            libxcb-dri3-dev libxcb-dri2-0-dev libxcb-present-dev libxcb-randr0-dev libxcb-sync-dev libxcb-shm0-dev \
            libxcb-glx0-dev libxcb-xfixes0-dev libxshmfence-dev libxrandr-dev libdrm-dev x11proto-dri2-dev
          PROSPEROTUBE_SHADER_JOBS="$(nproc)" bash scripts/build_ps5_shader_compiler.sh
          tools="$HOME/.cache/prosperotube/shader-tools"
          rm -rf "$tools/src" "$tools/build" "$tools/dxc" "$tools"/*.tar.gz

      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-clang18-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-clang18-

      - name: Install the service bundle's dependencies
        working-directory: companion/innertube
        run: npm ci --ignore-scripts

      - name: Install the host test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r companion/requirements.lock

      - name: Run the offline checks
        run: bash scripts/test_all.sh

      - name: Build the app
        run: bash scripts/build_ps5.sh

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Verify and archive the release
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -f "$TITLE_ID.zip"
          # The console only starts an app whose files are open to all, and some tools
          # keep a ZIP's permissions when unpacking: every entry is stored as 0777.
          if [[ -n "${BUILD_LABEL:-}" ]]; then
            python3 ../scripts/zip_open_modes.py "$TITLE_ID.zip" --label "$BUILD_LABEL"
          else
            python3 ../scripts/zip_open_modes.py "$TITLE_ID.zip"
          fi
          python3 - "$TITLE_ID.zip" "$TITLE_ID" "$CONTENT_VERSION" <<'PY'
          import json, sys, zipfile
          archive, title, version = sys.argv[1:4]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "damaged ZIP entry"
              names = z.namelist()
              assert all(n.startswith(title + "/") for n in names), "entries outside the app folder"
              assert title + "/eboot.bin" in names, "no eboot.bin"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              meta = json.loads(z.read(title + "/sce_sys/param.json"))
              assert meta["titleId"] == title and meta["contentVersion"] == version, meta
              print(f"{archive}: {len(names)} entries, all 0777, version {version}")
          PY
          sha256sum "$TITLE_ID.zip" > SHA256SUMS
          cat SHA256SUMS

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TITLE_ID }}.zip

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: |
            dist/${{ env.TITLE_ID }}.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload the check logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-logs
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: GitHub pre-release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CHANGELOG.md
            docs/releases
            scripts/release_version.py
            scripts/prepare_native.py
          sparse-checkout-cone-mode: false

      - name: Download the verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "prosperotube-release-$GITHUB_SHA"
          --dir release

      - name: Verify the release files
        shell: bash
        run: |
          set -euo pipefail
          cd release
          test "$(find . -type f | wc -l)" -eq 2
          sha256sum --check --strict SHA256SUMS

      - name: Prepare the release notes
        shell: bash
        run: |
          python3 scripts/release_version.py --notes > release-notes.md
          test -s release-notes.md
          read -r _ _ version <<< "$(python3 scripts/release_version.py)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # A pre-release: the app's update check reads the list of releases and takes
      # the highest version in it, pre-releases included (native/tube_update.h).
      - name: Publish the GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(release/PPSA99142.zip release/SHA256SUMS)
          TAG=$GITHUB_REF_NAME
          # CI is the source of truth for release files: create the release, or fill one that
          # has no ZIP yet, and never replace a ZIP that is already published.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "ProsperoTube $APP_VERSION" --notes-file release-notes.md
            exit 0
          fi
          existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            if [[ $name == *.zip ]]; then
              echo "::warning title=Release files not from this run::A release for $TAG already has a ZIP; it was not replaced."
              exit 0
            fi
          done <<< "$existing"
          # Notes written in advance, or a draft: add the two files, leave title and notes alone.
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
