[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prosperotube-companion"
version = "1.004.001"
description = "User-controlled LAN service for the native ProsperoTube PS5 client"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "yt-dlp[default]>=2026.8.19"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
prosperotube-companion = "prosperotube.__main__:main"

[tool.setuptools.packages.find]
where = ["companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["companion", "scripts"]
